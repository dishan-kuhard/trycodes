<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>
    
    <main>
        <!-- Search Bar -->
        <section class="search-section">
            <input 
                type="text" 
                id="search-input" 
                class="search-bar" 
                placeholder="🔍 Search recipes by title or ingredients..."
                autocomplete="off"
            >
        </section>

        <!-- Filter & Sort Controls -->
        <section class="controls">
            <div class="filters">
                <button data-filter="all">All Recipes</button>
                <button data-filter="easy">Easy Recipes</button>
                <button data-filter="medium">Medium Recipes</button>
                <button data-filter="hard">Hard Recipes</button>
                <button data-filter="quick">Quick Recipes (Under 30 minutes)</button>
                <button data-filter="favorites">❤️ Favorites</button>
            </div>
            <div class="sorters">
                <button data-sort="name">Sort: Name (A–Z)</button>
                <button data-sort="time">Sort: Time (Fastest First)</button>
            </div>
        </section>

        <!-- Recipe Counter -->
        <div class="recipe-counter">
            <p id="recipe-count">Showing 0 of 0 recipes</p>
        </div>

        <!-- Recipe Container -->
        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
